name: Release

# Builds, tests and packs the activity suite, then publishes the packages as a
# GitHub Release.
#
# Triggered by pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`),
# or manually from the Actions tab.
#
# Runs on Windows because every project targets net6.0-windows.
#
# NOTE ON STUDIO ICONS: the design assembly resolves System.Activities.Presentation from
# a local UiPath Studio install. That assembly ships only with Studio - it is on no public
# feed - so a hosted runner cannot build it, and the package produced here works fully but
# shows no per-activity icons in the panel.
#
# Rather than let that pass unnoticed, the job checks the packed .nupkg and says so in the
# release notes. For an icon-complete package (the one UiPath Marketplace wants), run
# tools/pack-with-icons.ps1 on a machine with Studio and upload that .nupkg over the asset.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release, e.g. v1.0.0. The tag is created at the checked-out commit if it does not already exist.'
        required: true
        default: 'v1.0.0'
      replace_existing:
        description: 'Delete an existing release with this tag (and the tag itself) before publishing. Destructive - leave unchecked unless you mean to replace a release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x builds the solution (the .slnx format needs a recent SDK);
          # 6.0.x supplies the net6.0-windows runtime the tests execute against.
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Shaker.TextRecognizers.slnx

      - name: Build
        run: dotnet build Shaker.TextRecognizers.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Shaker.TextRecognizers.Tests/Shaker.TextRecognizers.Tests.csproj -c Release --no-build

      # No --no-build here: TextRecognizers.Core sets IsPackable=false, and packing the
      # solution still invokes its Build target, which NoBuild rejects (NETSDK1085).
      - name: Pack
        run: dotnet pack Shaker.TextRecognizers.slnx -c Release -o build/packages

      # On a tag push the tag is github.ref_name; on a manual run it comes from the
      # input above. `gh release create` creates the tag at this commit if needed.
      - name: Resolve the version tag
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      # Opt-in only: gh release create fails outright if the tag is already taken, so
      # replacing a release has to be deliberate rather than a silent overwrite.
      - name: Delete the existing release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "$env:TAG" 2>$null) {
            gh release delete "$env:TAG" --yes --cleanup-tag
            "Deleted the existing release $env:TAG and its tag."
          } else {
            "No existing release $env:TAG to delete."
          }
        shell: pwsh

      # Say plainly whether the artifact carries the per-activity icons, so a release built
      # here is never mistaken for the one to submit to Marketplace.
      # Say plainly whether the artifact carries the per-activity icons, so a release built
      # here is never mistaken for the one to submit to Marketplace.
      - name: Check the package for the design assembly
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem build/packages -Filter *.nupkg | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            $hasDesign = [bool]($zip.Entries | Where-Object { $_.Name -like '*.Design.dll' })
          } finally { $zip.Dispose() }

          Copy-Item CHANGELOG.md release-notes.md
          if ($hasDesign) {
            Write-Host "Design assembly present - per-activity icons included."
          } else {
            Write-Host "::warning::No design assembly in $($pkg.Name) - the activities will have no panel icons."
            $note = @(
              ''
              '---'
              ''
              '> **Built on a hosted runner, so this package has no per-activity panel icons.**'
              '> The design assembly that carries them needs UiPath Studio installed, which a'
              '> GitHub runner does not have. The activities themselves work exactly as documented.'
              '>'
              '> For an icon-complete package - the one to submit to UiPath Marketplace - run'
              '> `tools/pack-with-icons.ps1` on a machine with Studio.'
            )
            Add-Content release-notes.md $note
          }
        shell: pwsh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:TAG"
          (Get-ChildItem build/packages/*.nupkg).FullName
          --title "Text Recognizers $env:TAG"
          --notes-file release-notes.md
        shell: pwsh
