name: Release

# Builds, tests and packs the activity suite, then publishes the packages as a
# GitHub Release.
#
# Triggered by pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`),
# or manually from the Actions tab.
#
# Runs on Windows because every project targets net6.0-windows.
#
# The design assembly carrying the per-activity icons builds here too: it compiles against
# the reference stubs in stubs/ rather than against a UiPath Studio install, and Studio
# supplies the real assemblies at run time. See stubs/README.md.
#
# So the package this publishes is the complete one. RequireDesignAssembly=true makes that a
# hard requirement rather than a hope - the pack fails outright if the icons are missing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release, e.g. v1.0.0. The tag is created at the checked-out commit if it does not already exist.'
        required: true
        default: 'v1.0.0'
      replace_existing:
        description: 'Delete an existing release with this tag (and the tag itself) before publishing. Destructive - leave unchecked unless you mean to replace a release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x builds the solution (the .slnx format needs a recent SDK);
          # 6.0.x supplies the net6.0-windows runtime the tests execute against.
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Shaker.TextRecognizers.slnx

      - name: Build
        run: dotnet build Shaker.TextRecognizers.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Shaker.TextRecognizers.Tests/Shaker.TextRecognizers.Tests.csproj -c Release --no-build

      # No --no-build here: TextRecognizers.Core sets IsPackable=false, and packing the
      # solution still invokes its Build target, which NoBuild rejects (NETSDK1085).
      # Pack the package project, not the solution: the design and stub projects are
      # IsPackable=false and --no-build would trip NETSDK1085 on them. The solution build
      # above has already produced the design assembly this embeds.
      - name: Pack
        run: dotnet pack src/Shaker.TextRecognizers.Activities/Shaker.TextRecognizers.Activities.csproj -c Release -o build/packages --no-build -p:RequireDesignAssembly=true

      # On a tag push the tag is github.ref_name; on a manual run it comes from the
      # input above. `gh release create` creates the tag at this commit if needed.
      - name: Resolve the version tag
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      # Opt-in only: gh release create fails outright if the tag is already taken, so
      # replacing a release has to be deliberate rather than a silent overwrite.
      - name: Delete the existing release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "$env:TAG" 2>$null) {
            gh release delete "$env:TAG" --yes --cleanup-tag
            "Deleted the existing release $env:TAG and its tag."
          } else {
            "No existing release $env:TAG to delete."
          }
        shell: pwsh

      # Trust the artifact rather than the build log: open it and look.
      - name: Verify the package is complete
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem build/packages -Filter *.nupkg | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.Name }
          } finally { $zip.Dispose() }

          $zip2 = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try { $paths = $zip2.Entries | ForEach-Object { $_.FullName } } finally { $zip2.Dispose() }

          $missing = @()
          if ($names -notcontains 'Shaker.TextRecognizers.Activities.Design.dll') {
            $missing += 'the design assembly (per-activity panel icons)'
          }
          if ($names -notcontains 'icon.png') { $missing += 'the package icon' }

          # Studio decides which project types it supports from the lib folders and the
          # manifest's target-framework groups. Offering only the Windows flavour makes it
          # report "This package is not compatible with Windows projects".
          foreach ($tfm in 'lib/net6.0/', 'lib/net6.0-windows7.0/') {
            if (-not ($paths | Where-Object { $_.StartsWith($tfm) })) { $missing += "$tfm is empty" }
          }
          if ($paths -notcontains 'Shaker.TextRecognizers.Activities.Design.dll' -and
              -not ($paths | Where-Object { $_ -eq 'lib/net6.0-windows7.0/Shaker.TextRecognizers.Activities.Design.dll' })) {
            $missing += 'the design assembly is not in lib/net6.0-windows7.0/'
          }

          # The stubs stand in for assemblies Studio owns; shipping them would shadow the real ones.
          foreach ($stub in 'System.Activities.Presentation.dll', 'System.Activities.Metadata.dll') {
            if ($names -contains $stub) { $missing += "$stub leaked into the package" }
          }

          if ($missing.Count) {
            Write-Host "::error::$($pkg.Name) is not publishable: $($missing -join '; ')"
            exit 1
          }
          Write-Host "$($pkg.Name) is complete: both lib folders, designers in the Windows one, package icon present, no stubs shipped."
        shell: pwsh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:TAG"
          (Get-ChildItem build/packages/*.nupkg).FullName
          --title "Text Recognizers $env:TAG"
          --notes-file CHANGELOG.md
        shell: pwsh
